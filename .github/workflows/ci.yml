name: CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for deterministic builds

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore /p:CI=true

    - name: Run unit tests
      run: dotnet test tests/AotKafka.Tests/AotKafka.Tests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Run integration tests (with Testcontainers)
      if: matrix.os == 'ubuntu-latest'
      run: dotnet test tests/AotKafka.IntegrationTests/AotKafka.IntegrationTests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Run integration tests (Windows - without heavy SASL tests)
      if: matrix.os == 'windows-latest'
      run: dotnet test tests/AotKafka.IntegrationTests/AotKafka.IntegrationTests.csproj --configuration Release --no-build --verbosity normal --filter "FullyQualifiedName!~SaslIntegrationTests" --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Merge coverage reports
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        reportgenerator \
          -reports:./coverage/**/coverage.cobertura.xml \
          -targetdir:./coverage/report \
          -reporttypes:"Html;Cobertura;MarkdownSummaryGithub" \
          -assemblyfilters:"+AotKafka;+AotKafka.Core;+AotKafka.Native"

    - name: Upload coverage to GitHub
      if: github.event_name == 'pull_request'
      run: cat ./coverage/report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./coverage/report

    - name: Publish coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage/report/Cobertura.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  build-aot:
    name: AOT Build Verification
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Publish AOT (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: dotnet publish samples/AotKafka.AotSample/AotKafka.AotSample.csproj -r linux-x64 -c Release

    - name: Publish AOT (Windows)
      if: matrix.os == 'windows-latest'
      run: dotnet publish samples/AotKafka.AotSample/AotKafka.AotSample.csproj -r win-x64 -c Release

    - name: Publish AOT (macOS)
      if: matrix.os == 'macos-latest'
      run: dotnet publish samples/AotKafka.AotSample/AotKafka.AotSample.csproj -r osx-x64 -c Release

    - name: Upload AOT artifacts
      uses: actions/upload-artifact@v4
      with:
        name: aot-sample-${{ matrix.os }}
        path: samples/AotKafka.AotSample/bin/Release/net8.0/*/publish/
